<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Stream Sub Timer</title>
  <link rel="stylesheet" href="../workout/css/workout-theme.css">
  <link rel="stylesheet" href="/css/stream-bg.css">
  <style>
    body {
      background: transparent !important;
      margin: 0;
      padding: 12px;
      display: flex;
      align-items: flex-start;
      justify-content: flex-start;
      min-height: 100vh;
      overflow: hidden;
    }

    .sub-goal-wrap {
      width: min(420px, 100%);
    }

    .sub-goal-body {
      text-align: center;
      padding: 20px 22px 18px;
    }

    .sub-goal-eyebrow {
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--blue-bright);
      margin-bottom: 8px;
    }

    .sub-goal-time {
      font-family: var(--font-display);
      font-size: 3.4rem;
      font-weight: 900;
      line-height: 1;
      color: var(--white);
      letter-spacing: 0.02em;
      text-shadow: 0 0 24px rgba(255, 87, 34, 0.35);
      font-variant-numeric: tabular-nums;
    }

    .sub-goal-cap {
      margin-top: 8px;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .sub-goal-cap strong {
      color: var(--orange-bright);
      font-weight: 800;
    }

    .sub-goal-progress {
      margin-top: 16px;
      height: 8px;
      border-radius: 999px;
      background: var(--bg-card);
      border: 1px solid var(--border-light);
      overflow: hidden;
    }

    .sub-goal-progress-fill {
      height: 100%;
      width: 0%;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--orange), var(--blue));
      box-shadow: 0 0 16px var(--orange-glow);
      transition: width 0.35s ease;
    }

    .sub-goal-meta {
      margin-top: 12px;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-muted);
      display: flex;
      flex-wrap: wrap;
      gap: 6px 10px;
      justify-content: center;
      align-items: center;
    }

    .sub-goal-meta [data-sub-status] {
      color: var(--blue-bright);
    }

    .sub-goal-wrap.is-running [data-sub-status] {
      color: var(--orange-bright);
    }

    .sub-goal-wrap.goal-hit .sub-goal-time {
      color: var(--orange-bright);
      text-shadow: 0 0 28px var(--orange-glow);
    }

    .sub-goal-wrap.goal-hit .sub-goal-cap strong {
      color: var(--white);
    }
  </style>
</head>
<body>
  <div class="sub-goal-wrap panel orange-accent stream-bg" id="subGoalRoot">
    <div class="panel-header orange"><span class="icon">⏱️</span> Stream Timer</div>
    <div class="panel-body sub-goal-body">
      <div class="sub-goal-eyebrow" data-sub-label>12 Hour Stream</div>
      <div class="sub-goal-time" data-sub-time>4:00:00</div>
      <div class="sub-goal-cap">time left · max <strong data-sub-max>12:00:00</strong></div>
      <div class="sub-goal-progress" aria-hidden="true">
        <div class="sub-goal-progress-fill" data-sub-fill></div>
      </div>
      <div class="sub-goal-meta">
        <span data-sub-meta>0 / 50 subs · +9.6 min</span>
        <span aria-hidden="true">·</span>
        <span data-sub-status>paused</span>
      </div>
    </div>
  </div>

  <script src="js/sub-goal.js?v=5"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const width = parseInt(params.get("width"), 10);
    if (width > 0) {
      document.querySelector(".sub-goal-wrap").style.width = `${width}px`;
    }
    initSubGoalWidget({ root: document.getElementById("subGoalRoot") });
  </script>
</body>
</html>
